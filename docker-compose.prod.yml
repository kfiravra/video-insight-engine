# ============================================
# Video Insight Engine - Production (full self-host)
# ============================================
#
# Usage:
#   docker compose -f docker-compose.prod.yml config   # validate env
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Every secret uses ${VAR:?...} — compose refuses to start with any of them
# missing, so a prod boot can never silently fall back to dev defaults
# (api/src/config.ts additionally refuses well-known dev secrets in
# NODE_ENV=production).
#
# Exposure policy:
#   - Published: vie-web (80) and vie-api (3000). Front both with a TLS
#     reverse proxy (Caddy/Traefik/nginx) and set TRUST_PROXY=1.
#   - vie-admin binds 127.0.0.1 only — reach it via SSH tunnel.
#   - Datastores (Mongo/Redis/Qdrant/RabbitMQ) publish NO host ports; they
#     are reachable only on the internal network, with Mongo/Redis/RabbitMQ
#     additionally password-protected.
#
# Load-balancer/orchestrator readiness: gate traffic on vie-api `/ready`
# (checks Mongo/Redis/broker); `/health` is pure liveness. Single replica
# per service only — see docs/INFRASTRUCTURE.md § Single-replica assumptions.

# ----------------------------------------
# Shared env (YAML anchors)
# ----------------------------------------
# Explicit allow-list per Python service. api-only secrets (JWT_*,
# MONGO_ROOT_PASS, ADMIN_API_KEY, PADDLE_WEBHOOK_SECRET) intentionally do
# not appear here — they must not propagate into a Python container if that
# service is compromised.
x-summarizer-env: &summarizer-env
  PYTHONUNBUFFERED: "1"
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LLM_FAST_MAX_TOKENS: ${LLM_FAST_MAX_TOKENS:-2048}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60.0}
  LLM_NUM_RETRIES: ${LLM_NUM_RETRIES:-2}
  LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-}
  # Enrichment: blank = the fast tier of LLM_PROVIDER. Vision: Sonnet on purpose (frame descriptions
  # drive the moment gallery; owner rejected Haiku for it 2026-09-16). config.py keeps the Haiku dev pins.
  LLM_ENRICHMENT_MODEL: ${LLM_ENRICHMENT_MODEL:-}
  LLM_VISION_MODEL: ${LLM_VISION_MODEL:-anthropic/claude-sonnet-4-6}
  LLM_DESCRIPTION_MODEL: ${LLM_DESCRIPTION_MODEL:-}
  LLM_SYNTHESIS_MODEL: ${LLM_SYNTHESIS_MODEL:-}
  LLM_TRANSLATION_MODEL: ${LLM_TRANSLATION_MODEL:-}
  EXTRACTION_USE_FAST_FIRST: ${EXTRACTION_USE_FAST_FIRST:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # production arms the default-INTERNAL_SECRET refusal and SSE soft-fail; json = CloudWatch-parseable logs
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Target for /internal/status callbacks
  API_URL: ${API_URL:-http://vie-api:3000}
  # Hard caps on accepted video length and on the paid audio-transcription fallback
  MAX_VIDEO_DURATION_MINUTES: ${MAX_VIDEO_DURATION_MINUTES:-600}
  WHISPER_MAX_DURATION_MINUTES: ${WHISPER_MAX_DURATION_MINUTES:-600}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required (openssl rand -base64 32)}
  WEBSHARE_PROXY_USERNAME: ${WEBSHARE_PROXY_USERNAME:-}
  WEBSHARE_PROXY_PASSWORD: ${WEBSHARE_PROXY_PASSWORD:-}
  YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
  TRANSCRIPT_CLEANING_ENABLED: ${TRANSCRIPT_CLEANING_ENABLED:-true}
  TRANSCRIPT_CLEANING_TIMEOUT: ${TRANSCRIPT_CLEANING_TIMEOUT:-30.0}
  HF_TOKEN: ${HF_TOKEN:-}
  S3_BUCKET: ${S3_BUCKET:-vie-transcripts}
  S3_PRESIGNED_URL_EXPIRY: ${S3_PRESIGNED_URL_EXPIRY:-21600}
  AWS_REGION: ${AWS_REGION:?AWS_REGION is required (region of S3_BUCKET)}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  FRAME_EXTRACTION_ENABLED: ${FRAME_EXTRACTION_ENABLED:-true}
  SCENE_EXTRACTION_ENABLED: ${SCENE_EXTRACTION_ENABLED:-true}
  SCENE_HIRES_ENABLED: ${SCENE_HIRES_ENABLED:-true}
  SCENE_S3_PREFIX: ${SCENE_S3_PREFIX:-scenes-v3}
  SCENE_HIRES_TIMEOUT: ${SCENE_HIRES_TIMEOUT:-90.0}
  SCENE_HIRES_FALLBACK_TIMEOUT: ${SCENE_HIRES_FALLBACK_TIMEOUT:-180.0}
  # yt-dlp player clients for video/audio downloads — the knob to turn when
  # YouTube shifts which clients' download URLs 403 (2026-08: android only)
  YTDLP_PLAYER_CLIENTS: ${YTDLP_PLAYER_CLIENTS:-android}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
  LANGFUSE_FAITHFULNESS_SAMPLE_RATE: ${LANGFUSE_FAITHFULNESS_SAMPLE_RATE:-0.2}
  LANGFUSE_USER_ID_MODE: ${LANGFUSE_USER_ID_MODE:-hash}
  LANGFUSE_USER_ID_HASH_SALT: ${LANGFUSE_USER_ID_HASH_SALT:-}
  # Sentry — empty DSN = SDK no-ops
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  # LLM alert webhook — empty URL = alerts stay Mongo-only (llm_common/alerts.py)
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  # Per-call high-cost alert threshold (llm_common/callback.py); default $0.50
  ALERT_COST_THRESHOLD_USD: ${ALERT_COST_THRESHOLD_USD:-0.50}
  # Stall sweeper (HTTP process only; src/services/stall_sweeper.py)
  STALL_SWEEP_ENABLED: ${STALL_SWEEP_ENABLED:-true}
  STALL_SWEEP_INTERVAL_SECONDS: ${STALL_SWEEP_INTERVAL_SECONDS:-300}
  STALL_THRESHOLD_MINUTES: ${STALL_THRESHOLD_MINUTES:-30}

x-assistant-env: &assistant-env
  PYTHONUNBUFFERED: "1"
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60.0}
  LLM_NUM_RETRIES: ${LLM_NUM_RETRIES:-2}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required (openssl rand -base64 32)}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
  LANGFUSE_USER_ID_MODE: ${LANGFUSE_USER_ID_MODE:-hash}
  LANGFUSE_USER_ID_HASH_SALT: ${LANGFUSE_USER_ID_HASH_SALT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  # Per-call high-cost alert threshold (llm_common/callback.py); default $0.50
  ALERT_COST_THRESHOLD_USD: ${ALERT_COST_THRESHOLD_USD:-0.50}

# ----------------------------------------
# Container log rotation (YAML anchor)
# ----------------------------------------
# Without this the json-file driver grows unbounded and can fill the host
# disk. Applied to every service: ~30 MB cap per container (3 x 10 MB).
# Keep in sync with docker-compose.yml.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared connection strings (authenticated datastores)
x-mongodb-uri: &mongodb-uri mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}:${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}@vie-mongodb:27017/video-insight-engine?authSource=admin
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@vie-redis:6379
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@vie-rabbitmq:5672/

services:
  # ----------------------------------------
  # Infrastructure (no published ports)
  # ----------------------------------------

  vie-mongodb:
    image: mongo:7
    container_name: vie-mongodb
    restart: always
    logging: *default-logging
    mem_limit: 1g
    volumes:
      - vie_mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: video-insight-engine
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}
    networks:
      - vie-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  vie-qdrant:
    # Pin matches docker-compose.yml — bump both together (storage format).
    image: qdrant/qdrant:v1.18.2
    container_name: vie-qdrant
    restart: always
    logging: *default-logging
    mem_limit: 2g
    volumes:
      - vie_qdrant_data:/qdrant/storage
    networks:
      - vie-network
    healthcheck:
      # Real readiness (/readyz = "all shards are ready"), not a bare TCP
      # connect. The image has bash but no curl/wget, so the request is
      # hand-written over /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -c 300 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  vie-redis:
    image: redis:7-alpine
    container_name: vie-redis
    restart: always
    logging: *default-logging
    mem_limit: 512m
    volumes:
      - vie_redis_data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - vie-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  vie-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vie-rabbitmq
    restart: always
    logging: *default-logging
    mem_limit: 1g
    volumes:
      - vie_rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      - vie-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------
  # Application Services
  # ----------------------------------------

  vie-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: vie-api:prod
    container_name: vie-api
    restart: always
    logging: *default-logging
    mem_limit: 1g
    ports:
      - "3000:3000"
    volumes:
      # Canonical pipeline version — the prod image ships only dist/, so the
      # shared JSON must be mounted (config.ts prefers this docker path).
      - ./packages/shared/src/config/pipeline-version.json:/app/shared/pipeline-version.json:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: *mongodb-uri
      SUMMARIZER_URL: http://vie-summarizer:8000
      ASSISTANT_URL: http://vie-assistant:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 32)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (openssl rand -base64 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required (public https origin of vie-web)}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required (openssl rand -base64 32)}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required (openssl rand -base64 32)}
      # api/src/config.ts refuses to boot production without a webhook secret —
      # unsigned Paddle events must never be accepted.
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:?PADDLE_WEBHOOK_SECRET is required in production}
      PADDLE_PRO_PRICE_ID: ${PADDLE_PRO_PRICE_ID:-}
      PADDLE_TEAM_PRICE_ID: ${PADDLE_TEAM_PRICE_ID:-}
      RABBITMQ_URL: *rabbitmq-url
      USE_QUEUE_PIPELINE: ${USE_QUEUE_PIPELINE:-true}
      REDIS_URL: *redis-url
      DISPATCH_GUARD_TTL_SECONDS: ${DISPATCH_GUARD_TTL_SECONDS:-900}
      # Behind the TLS reverse proxy: derive req.ip from X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Spend guards (defaults mirror api/src/config.ts; the demo .env tightens them)
      VIDEO_DAILY_LIMIT: ${VIDEO_DAILY_LIMIT:-100}
      # Requests per minute per IP on the public api
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      # Daily LLM spend ceiling in USD, read by the cost monitor
      COST_DAILY_LIMIT: ${COST_DAILY_LIMIT:-20}
      USER_COST_LIMIT_FREE: ${USER_COST_LIMIT_FREE:-2}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      S3_BUCKET: ${S3_BUCKET:-vie-transcripts}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required (region of S3_BUCKET)}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      FRAME_URL_TTL_SECONDS: ${FRAME_URL_TTL_SECONDS:-21600}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-redis:
        condition: service_healthy
      vie-rabbitmq:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: /ready pings Mongo + Redis + RabbitMQ (2s each)
      # so `depends_on: service_healthy` and `docker compose ps` reflect whether
      # the API can actually serve, not just that the process is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot: registers local prompt templates in Langfuse, then exits.
  # Non-blocking — services fall back to local .txt prompts (see dev compose).
  vie-langfuse-init:
    image: vie-summarizer:prod
    container_name: vie-langfuse-init
    build:
      context: .
      dockerfile: services/summarizer/Dockerfile
    restart: "no"
    logging: *default-logging
    command: ["python", "/repo/scripts/register_prompts.py", "--commit"]
    working_dir: /repo
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./services/summarizer/src/prompts:/repo/services/summarizer/src/prompts:ro
      - ./services/assistant/src/utils/prompt_templates.py:/repo/services/assistant/src/utils/prompt_templates.py:ro
    networks:
      - vie-network

  vie-summarizer:
    build:
      context: .
      dockerfile: services/summarizer/Dockerfile
    image: vie-summarizer:prod
    container_name: vie-summarizer
    restart: always
    logging: *default-logging
    mem_limit: 4g
    volumes:
      - ./packages/shared/src/config/domains.json:/app/shared/domains.json:ro
      - ./packages/shared/src/config/pipeline-version.json:/app/shared/pipeline-version.json:ro
    environment:
      <<: *summarizer-env
      MONGODB_URI: *mongodb-uri
      QDRANT_HOST: vie-qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: *redis-url
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-qdrant:
        condition: service_healthy
      vie-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RabbitMQ consumer — same image as vie-summarizer, worker entrypoint.
  vie-summarizer-worker:
    build:
      context: .
      dockerfile: services/summarizer/Dockerfile
    image: vie-summarizer:prod
    container_name: vie-summarizer-worker
    restart: always
    logging: *default-logging
    mem_limit: 4g
    command: ["python", "-m", "src.worker"]
    volumes:
      - ./packages/shared/src/config/domains.json:/app/shared/domains.json:ro
      - ./packages/shared/src/config/pipeline-version.json:/app/shared/pipeline-version.json:ro
    environment:
      <<: *summarizer-env
      MONGODB_URI: *mongodb-uri
      QDRANT_HOST: vie-qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: *redis-url
      RABBITMQ_URL: *rabbitmq-url
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      # Base retry delay, doubled per attempt (5 → 10 → 20 s), capped at 120 s
      WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-5}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-redis:
        condition: service_healthy
      vie-rabbitmq:
        condition: service_healthy
    # No HTTP surface — liveness = heartbeat file mtime (src/worker/__main__.py)
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; st=os.stat('/tmp/vie-worker-heartbeat'); sys.exit(0 if time.time()-st.st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  vie-assistant:
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
    image: vie-assistant:prod
    container_name: vie-assistant
    restart: always
    logging: *default-logging
    mem_limit: 3g
    # No host port: internal-only (reachable on vie-network as vie-assistant:8001)
    environment:
      <<: *assistant-env
      ASSISTANT_PORT: "8001"
      MONGODB_URI: *mongodb-uri
      QDRANT_URL: http://vie-qdrant:6333
      QDRANT_COLLECTION: transcript_chunks
      MAX_CONTEXT_CHUNKS: "8"
      MAX_CONVERSATION_TURNS: "20"
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  vie-admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    image: vie-admin:prod
    container_name: vie-admin
    restart: always
    logging: *default-logging
    mem_limit: 512m
    # Loopback-only: operator UI, reach via SSH tunnel (ssh -L 8002:127.0.0.1:8002)
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      # Host backups dir (read-only) — the evaluator's backup-stale dead-man's
      # switch reads the newest manifest.json timestamp from here.
      - ./backups:/backups:ro
    environment:
      PYTHONUNBUFFERED: 1
      MONGODB_URI: *mongodb-uri
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required (openssl rand -base64 32)}
      VIE_API_URL: http://vie-api:3000
      VIE_SUMMARIZER_URL: http://vie-summarizer:8000
      VIE_ASSISTANT_URL: http://vie-assistant:8001
      QDRANT_URL: http://vie-qdrant:6333
      ALERT_COST_THRESHOLD_USD: ${ALERT_COST_THRESHOLD_USD:-0.50}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Backup dead-man's switch — newest manifest under BACKUP_DIR older than
      # BACKUP_MAX_AGE_HOURS trips a backup_stale alert (alert_evaluator.py).
      BACKUP_DIR: /backups
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  vie-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Vite bakes these at BUILD time — must point at the public API origin
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required (public https origin of vie-api + /api)}
        VITE_WS_URL: ${VITE_WS_URL:?VITE_WS_URL is required (public wss origin of vie-api + /ws)}
        # Never enable the dev login bypass in a production image
        VITE_ENABLE_DEV_LOGIN: "false"
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    image: vie-web:prod
    container_name: vie-web
    restart: always
    logging: *default-logging
    mem_limit: 256m
    ports:
      # nginx-unprivileged listens on 5173 inside the container
      - "80:5173"
    networks:
      - vie-network
    depends_on:
      vie-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Backup scheduler (opt-in: `docker compose --profile backup up -d`)
  # ----------------------------------------
  # Runs scripts/backup.sh nightly from inside the stack so the schedule is
  # committed with the repo instead of living in a dev-box crontab. Needs the
  # docker socket (mongodump runs via `docker exec vie-mongodb`) — root-equivalent
  # on the host, which is why it is a profile and not on by default.
  vie-backup-cron:
    build:
      context: .
      dockerfile: ./scripts/backup-cron/Dockerfile
    image: vie-backup-cron:latest
    container_name: vie-backup-cron
    # busybox crond as PID 1 ignores SIGTERM; tini forwards it so
    # `docker stop` doesn't wait 10s and SIGKILL a backup mid-write.
    init: true
    restart: unless-stopped
    logging: *default-logging
    profiles: ["backup"]
    environment:
      TZ: UTC
      MONGO_CONTAINER: vie-mongodb
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/repo/scripts:ro
      - ./backups:/repo/backups
    networks:
      - vie-network
    depends_on:
      vie-mongodb:
        condition: service_healthy
      vie-qdrant:
        condition: service_healthy

# ----------------------------------------
# Networks
# ----------------------------------------

networks:
  vie-network:
    driver: bridge
    name: vie-network

# ----------------------------------------
# Volumes
# ----------------------------------------

volumes:
  vie_mongodb_data:
    name: vie_mongodb_data
  vie_qdrant_data:
    name: vie_qdrant_data
  vie_redis_data:
    name: vie_redis_data
  vie_rabbitmq_data:
    name: vie_rabbitmq_data
