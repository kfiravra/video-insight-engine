  # ─── pipeline-1min assertion anchors (4) — added 2026-10-07 (task 0.7) ───
  # The first two ids are PROPOSALS for gate 0 (Kfir to confirm or swap);
  # neither was in the dev DB or the demo library, so they were picked on
  # YouTube (oEmbed/watch page checked 2026-10-07: live, English captions).
  - id: food-travel-montreal-vlog
    # PROPOSAL (gate 0): Mark Wiens, "Inside Canada's Fast Food PARADISE!!
    # (Montreal, Quebec)", 31:08, category Travel & Events, manual en captions.
    # Restaurant-hopping food-travel vlog: lots of food, zero cooking — the
    # case where recipe components (step_player / checklist ingredients) are
    # backfilled without evidence (C19).
    url: https://www.youtube.com/watch?v=v8KaQr0MhjE
    domain: travel
    format: vlog
    language: en
    expectedTabs: [overview, itinerary, highlights, filmstrip]
    requiredComponents: [overview, spot_explorer]
    forbiddenComponents: [quiz_arena]
    keyContent: [montreal, poutine, hot dog, burger, orange julep]
    assertions:
      - type: expectedDomain
        values: [travel, food]
      - type: expectedFormat
        values: [vlog, documentary, walkthrough]
      - type: forbiddenComponents
        components: [step_player, checklist]
        xfail: "C19 — domain backfill is unconditional until 1b.2 / 1d.7 (expected to pass at gate 1)"
      - type: quizAbsentOrLast
      - type: minItems
        component: spot_explorer
        field: spots
        min: 4
      - type: noTimestampBeyondDuration

