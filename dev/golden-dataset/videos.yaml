  - id: food-travel-montreal-vlog
    # Mark Wiens, "Inside Canada's Fast Food PARADISE!! (Montreal, Quebec)",
    # 31:08, category Travel & Events, manual en captions. A food-tasting
    # vlog (restaurant hopping): content domain food — the pipeline's
    # primaryTag in both baseline passes — with lots of food and zero
    # cooking, the case where recipe components (step_player / checklist
    # ingredients) are backfilled without evidence (C19).
    url: https://www.youtube.com/watch?v=v8KaQr0MhjE
    domain: food
    format: vlog
    language: en
    expectedTabs: [overview, food_stops, highlights, must_order]
    requiredComponents: [overview, spot_explorer]
    forbiddenComponents: [quiz_arena]
    keyContent: [montreal, poutine, hot dog, burger, orange julep]
    assertions:
      - type: expectedDomain
        values: [food, travel]
      - type: expectedFormat
        values: [vlog, documentary, walkthrough]
      - type: forbiddenComponents
        components: [step_player, checklist]
        xfail:
          reason: "C19 — domain backfill is unconditional (expected to pass at gate 1)"
          until: "1b.2 / 1d.7"
      - type: quizAbsentOrLast
      - type: minItems
        component: spot_explorer
        field: spots
        min: 4
      - type: noTimestampBeyondDuration

  - id: food-recipe-story-intro
