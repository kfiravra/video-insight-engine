    # Focaccia", 11:15, category Entertainment, en auto captions (English
    # narration over Italian speech). Opens with the village and the cook's
    # 55-year story before the recipe starts — recipe components must still
    # appear. Today the plan sees only the first 3,000 transcript chars (the
    # story), so step_player is missing: xfail until 1b.2.
    url: https://www.youtube.com/watch?v=wCkLNqy5OHE
    quick: true
    domain: food
    format: tutorial
    language: en
    expectedTabs: [overview, ingredients, steps, tips]
    requiredComponents: [overview, checklist, step_player]
    forbiddenComponents: [quiz_arena]
    keyContent: [focaccia, dough, onion, anchov, olive oil]
    assertions:
      - type: expectedDomain
        values: [food]
      - type: expectedFormat
        values: [tutorial, documentary, story, vlog]
      - type: requiredComponents
        components: [step_player, checklist]
        xfail:
          reason: "plan sees 3,000 chars; fixed by 1b.2"
          until: "1b.2"
      - type: forbiddenComponents
        components: [quiz_arena]
      - type: quizAbsentOrLast
      - type: minItems
        component: step_player
        field: steps
        min: 4
        xfail:
          reason: "plan sees 3,000 chars; fixed by 1b.2"
          until: "1b.2"
      - type: minItems
        component: checklist
        field: items
        min: 4
      - type: noTimestampBeyondDuration

