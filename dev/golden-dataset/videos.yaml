# Golden dataset — hand-curated YouTube videos used to track pipeline
# quality regressions over time.
#
# Distribution:
#   - 3 gaming/TCG (unboxing consistency anchors)  - 3 tech
#   - 3 food       - 2 learning    - 2 language    - 2 science
#   - 3 travel     - 2 fitness     - 2 review      - 1 music  - 1 documentary
#   - 4 pipeline-1min assertion anchors (food-travel vlog, story-intro recipe,
#     static-camera unboxing, do-along workout)
#
# Each entry is a contract:
#   id                 — stable slug used as the Langfuse dataset item ID
#   url                — YouTube URL the pipeline will fetch
#   domain             — primary contentTag the pipeline must produce
#   format             — one of the VALID_FORMATS in classifier.py (tutorial,
#                        commentary, reaction, opinion_rant, motivational,
#                        interview, lecture, vlog, documentary, walkthrough,
#                        podcast, news, news_commentary, entertainment,
#                        performance, comparison, story, unboxing)
#   language           — ISO-639-1 (en, es, fr, ja, …) — drives translation
#   expectedTabs       — tabs the pipeline SHOULD emit (count target ±1)
#   requiredComponents — components every successful run must include
#   forbiddenComponents— components that must NEVER appear for this video
#                        (hard product bugs — scored at weight 0.15, any hit
#                        zeroes the forbidden_ok term)
#   keyContent         — terms the extraction should mention (80%+ overlap target)
#   assertions         — optional deterministic per-video checks, validated by
#                        scripts/_eval_schema.py and gated by scripts/gate.py:
#                        expectedDomain, expectedFormat (classifier output from
#                        the Langfuse trace), forbiddenComponents,
#                        requiredComponents, quizAbsentOrLast, minItems,
#                        minItemsWithField, noTimestampBeyondDuration.
#                        Every live run also asserts it completed. `xfail:
#                        <reason>` keeps a known, tracked failure from failing
#                        the gate (it is still reported; XPASS = drop the marker).
#
# Curation rules:
#   - All videos are <35 minutes (so eval runs in ~2 hours, not days).
#   - All videos have working captions on YouTube.
#   - Component names must be CURRENT registry names (no retired: verdict,
#     quiz, code_explorer, gallery, lyrics_player, exercise_tracker, scenario).
#   - The 5 "admin-*" anchors are real videos processed in production runs —
#     their expectations were curated from actual known-good outputs.
#   - No celebrity / news content — those drift quickly.

