name: Eval

# LLM-quality gates (project-score-9 Phase 3; pipeline-1min 0.7):
#
#   golden-eval-dry-run  PR-triggered, zero spend. Exercises the golden-dataset
#                        schema + scoring path end to end (load → validate →
#                        score → report → --fail-under gate) so prompt/pipeline
#                        PRs can't break the eval machinery itself.
#   retrieval-eval       PR-triggered, zero LLM spend. Recall@k + MRR floors
#                        over the golden query→chunk fixture against an
#                        ephemeral Qdrant service container. Baseline:
#                        dev/golden-dataset/baseline.json (recall@3=1.0,
#                        MRR=0.865; floors 0.85 / 0.7).
#   golden-eval-live     MANUAL DISPATCH ONLY for now (D20): runs the live
#                        golden set against the PROD API as the eval user
#                        (C18 — no compose boot on the runner, so no proxy /
#                        S3 / OpenAI secrets on GitHub), bypassCache on every
#                        video, publishes a Langfuse dataset run and uploads
#                        the reports as an artifact. mode=noise-baseline runs
#                        the set twice and also uploads noise.json. The
#                        twice-a-month cron (`0 3 1,15 * *`) is re-enabled once
#                        the secrets land — see
#                        dev/active/pipeline-1min/env-changes.md.

on:
  pull_request:
    branches: [main]
    paths:
      - "services/summarizer/src/prompts/**"
      - "services/summarizer/src/services/pipeline/**"
      - "services/summarizer/src/services/vector/**"
      - "services/summarizer/tests/eval/**"
      - "services/summarizer/tests/fixtures/retrieval_golden.json"
      # Assistant query-side retrieval shares the Qdrant collection + encoder
      # with the summarizer's index side — changes here (relevance floor,
      # embedding model, search filters) must also trigger the retrieval eval.
      - "services/assistant/src/services/rag.py"
      - "services/assistant/src/repositories/qdrant_repository.py"
      - "services/assistant/src/config.py"
      - "scripts/run_eval.py"
      - "scripts/_eval_*.py"
      - "scripts/gate.py"
      - "dev/golden-dataset/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "eval = one pass + gate; noise-baseline = two passes → noise.json"
        type: choice
        options: [eval, noise-baseline]
        default: eval
      limit:
        description: "First N live golden entries (0 = all) — 1 for a plumbing dry-run"
        type: number
        default: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled by a newer push; a live eval in progress is
  # never killed mid-spend by a second dispatch (that one queues).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golden-eval-dry-run:
    name: Golden Eval (dry-run gate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml pydantic httpx

      # --dry-run makes zero network/LLM calls: it stubs each entry's output
      # and runs the real scoring + reporting + --fail-under exit-code path.
      # The floor is single-sourced from the committed baseline file.
      - name: Run scoring dry-run against the committed floor
        run: |
          FLOOR=$(python3 -c "import json; print(json.load(open('dev/golden-dataset/baseline.json'))['goldenEval']['failUnder'])")
          echo "fail-under floor: $FLOOR"
          python3 scripts/run_eval.py --dry-run --fail-under "$FLOOR" --output reports/

      - name: Upload dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-dry-run-report
          path: reports/eval-*.md
          retention-days: 14

  retrieval-eval:
    name: Retrieval Eval (recall@k + MRR floor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: services/summarizer
    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      # CI runners have no GPU; force the CPU embedding path.
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/summarizer/requirements.lock

      # Lockfile install, same as ci.yml / Dockerfile (unpinned requirements.txt
      # trips pip's resolution-too-deep cap).
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock

      - name: Install llm-common package
        run: pip install --no-deps -e ../../packages/llm-common

      # The SentenceTransformer weights (~90MB) download on first use; cache
      # them so the job doesn't re-pull the model every run.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-model-${{ runner.os }}

      # The harness skips when Qdrant is unreachable (local-dev affordance);
      # the service container above guarantees it runs here, so assert that no
      # test skipped — a silently-skipped floor is not a gate.
      - name: Run retrieval eval against ephemeral Qdrant
        run: |
          python -m pytest tests/eval/test_retrieval_eval.py -s -rs 2>&1 | tee retrieval-eval.log
          if grep -qE "^SKIPPED|[0-9]+ skipped" retrieval-eval.log; then
            echo "::error::retrieval eval skipped — Qdrant service container not reachable"
            exit 1
          fi

  golden-eval-live:
    name: Golden Eval (live, prod API → Langfuse)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 18 videos × ~3–5 min prod pipeline time, sequential, 30-min cap each;
    # noise-baseline mode runs the set twice.
    timeout-minutes: 350
    env:
      EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
      EVAL_USER_EMAIL: ${{ secrets.EVAL_USER_EMAIL }}
      EVAL_USER_PASSWORD: ${{ secrets.EVAL_USER_PASSWORD }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      MODE: ${{ inputs.mode || 'eval' }}
      LIMIT: ${{ inputs.limit || 0 }}
    steps:
      - uses: actions/checkout@v4

      # Forks / repos without the eval secrets: exit green without spending.
      # `if:` cannot read secrets directly, hence the env probe. Langfuse is
      # required: faithfulness (a primary metric) is read from the run traces.
      - name: Check eval secrets
        id: secrets
        run: |
          for name in EVAL_API_URL EVAL_USER_EMAIL EVAL_USER_PASSWORD LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "$name not configured — skipping live eval."
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.available == 'true'
        with:
          python-version: "3.11"

      - run: pip install pyyaml pydantic httpx
        if: steps.secrets.outputs.available == 'true'

      - name: Run live eval against the prod API
        if: steps.secrets.outputs.available == 'true'
        run: |
          STAMP=$(date +%Y%m%d)
          if [ "$MODE" = "noise-baseline" ]; then
            python3 scripts/run_eval.py --output reports/ --limit "$LIMIT" \
              --noise-runs 2 --noise-out reports/noise.json \
              --publish-run "golden-baseline-$STAMP"
          else
            FLOOR=$(python3 -c "import json; print(json.load(open('dev/golden-dataset/baseline.json'))['goldenEval']['failUnder'])")
            python3 scripts/run_eval.py --output reports/ --limit "$LIMIT" \
              --fail-under "$FLOOR" --publish-run "golden-$STAMP"
          fi

      # Gate on the committed noise file (absent until the first baseline is
      # committed). A --limit run is a plumbing check, not a gate.
      - name: Gate primary metrics against noise
        if: steps.secrets.outputs.available == 'true' && env.MODE == 'eval' && env.LIMIT == '0' && hashFiles('dev/golden-dataset/noise.json') != ''
        run: python3 scripts/gate.py --report "$(ls -t reports/eval-*.json | head -1)"

      - name: Upload live eval report
        if: always() && steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-${{ env.MODE }}-${{ github.run_id }}
          path: reports/
          retention-days: 90
