server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api and /ws proxies serve the dev stack only (docker-compose.yml publishes
    # vie-web directly). In the AWS deploy Caddy routes both to vie-api before a
    # request ever reaches nginx (see Caddyfile), so these blocks are never hit there.
    location /api {
        proxy_pass http://vie-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /ws {
        proxy_pass http://vie-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
